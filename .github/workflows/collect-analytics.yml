name: Collect Analytics

# Shared analytics collection: pulls performance data from all active channels,
# refreshes content memory summary.  Runs before any channel-specific weekly review.
#
# Monday 5:30am ET (10:30 UTC) -- 30 min before pinterest-weekly-review.yml (6:00am ET)
on:
  schedule:
    - cron: '30 10 * * 1'  # 10:30 UTC = 5:30 AM ET, Monday
  workflow_dispatch:       # Manual fallback trigger via GitHub UI
  workflow_call:           # Allow other workflows to call this

concurrency:
  group: slated-content-engine-analytics
  cancel-in-progress: false

env:
  PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
  PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
  PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
  PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
  PINTEREST_ENVIRONMENT: production
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  collect-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pipeline
        uses: ./.github/actions/setup-pipeline

      - name: Refresh Pinterest token
        run: python -m src.pinterest.token_manager

      - name: Pull Pinterest analytics
        id: pinterest-analytics
        run: python -m src.pinterest.pull_analytics

      - name: Notify Pinterest analytics summary
        if: always() && steps.pinterest-analytics.outcome != 'skipped'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -c "
          import json, pathlib, sys
          try:
              from src.shared.apis.slack_notify import SlackNotify
              snap_dir = pathlib.Path('data/analytics')
              snapshots = sorted(snap_dir.glob('*-raw.json'))
              if not snapshots:
                  SlackNotify().notify('Pinterest analytics: no snapshot created.', level='warning')
                  sys.exit(0)
              data = json.loads(snapshots[-1].read_text())
              pins = data.get('pins_tracked', 0)
              total_imp = sum(p.get('period_metrics', {}).get('IMPRESSION', 0) for p in data.get('pin_analytics', {}).values())
              total_saves = sum(p.get('period_metrics', {}).get('SAVE', 0) for p in data.get('pin_analytics', {}).values())
              total_clicks = sum(p.get('period_metrics', {}).get('OUTBOUND_CLICK', 0) for p in data.get('pin_analytics', {}).values())
              msg = f'Pinterest analytics: {pins} pins tracked, {int(total_imp)} impressions, {int(total_saves)} saves, {int(total_clicks)} outbound clicks ({snapshots[-1].name})'
              level = 'info'
              if total_imp > 0 and total_saves == 0 and total_clicks == 0:
                  msg += ' | Warning: 0 saves/clicks despite impressions (possible API lag)'
                  level = 'warning'
              SlackNotify().notify(msg, level=level)
          except Exception as e:
              print(f'Slack notification failed (non-fatal): {e}')
          "

      - name: Pull TikTok analytics
        id: tiktok-analytics
        continue-on-error: true  # Don't block Pinterest data commit if Publer creds missing
        env:
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_ID: ${{ secrets.PUBLER_ACCOUNT_ID }}  # Optional — omit for workspace-level
        run: python -m src.tiktok.pull_analytics

      - name: Warn on TikTok analytics failure
        if: steps.tiktok-analytics.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -c "
          import os
          try:
              from src.shared.apis.slack_notify import SlackNotify
              s = SlackNotify()
              s.notify('TikTok analytics pull failed (non-blocking). Check workflow logs.', level='warning')
          except Exception:
              pass
          "

      - name: Generate content memory summary
        # Python computation only -- no LLM call
        # Reads content-log.jsonl (all channels), computes aggregates,
        # writes content-memory-summary.md with channel attribution
        run: python -m src.shared.content_memory

      - name: Commit updated data files
        uses: ./.github/actions/commit-data
        with:
          message: "chore: update analytics and data files [skip ci]"

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "Collect Analytics"
          run_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
